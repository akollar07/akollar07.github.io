<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brigády</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #eef1ec; color: #1d2b2a; }
    main { width: min(100%, 560px); padding: 28px; border-radius: 18px; background: #fbfbf8; box-sizing: border-box; }
    h1 { margin-top: 0; }
    a { color: #1f4e4a; }
    @media (prefers-color-scheme: dark) {
      body { background: #101a19; color: #eaf0ec; }
      main { background: #182524; }
      a { color: #6fb5ac; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Brigády</h1>
    <p>Informácie o brigádach budú čoskoro doplnené.</p>
    <a href="./">Späť na hlavnú stránku</a>
  </main>
</body>
</html>
